<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <style>
    

.bg {
  fill: #0d1117;
}

.terminal-text {
  font-family: 'Share Tech Mono', monospace;
  font-size: 24px;
  fill: #58a6ff;
  dominant-baseline: middle;
  text-anchor: middle;
}

.prompt {
  fill: #f85149;
}

.cursor {
  fill: #3fb950;
  animation: blink 1s infinite steps(1);
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* Scramble animation frames using CSS variable / content steps or opacity clipping */
@keyframes scramble {
  0%   { opacity: 0; content: "7x9_f9!00.dat"; }
  10%  { opacity: 1; }
  20%  { content: "f#o_ciety00.da!"; }
  35%  { content: "fs0c1ety00.datx"; }
  50%  { content: "fsociety00.dat"; }
  100% { content: "fsociety00.dat"; }
}

.scramble-group {
  font-family: 'Share Tech Mono', monospace;
  font-size: 24px;
  fill: #58a6ff;
}

/* Alternative pure SVG text animation using opacity/switching elements or clip paths for ultimate compatibility */
.char {
  opacity: 0;
  animation: fadeInChar 0.1s forwards;
}

/* Staggered apparition delays for each character */
.c1  { animation-delay: 0.2s; }
.c2  { animation-delay: 0.4s; }
.c3  { animation-delay: 0.6s; }
.c4  { animation-delay: 0.8s; }
.c5  { animation-delay: 1.0s; }
.c6  { animation-delay: 1.2s; }
.c7  { animation-delay: 1.4s; }
.c8  { animation-delay: 1.6s; }
.c9  { animation-delay: 1.8s; }
.c10 { animation-delay: 2.0s; }
.c11 { animation-delay: 2.2s; }
.c12 { animation-delay: 2.4s; }
.c13 { animation-delay: 2.6s; }
.c14 { animation-delay: 2.8s; }

@keyframes fadeInChar {
  0% { opacity: 0; transform: translateY(5px); }
  100% { opacity: 1; transform: translateY(0); }
}

.subtext {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  fill: #8b949e;
  opacity: 0;
  animation: fadeIn 0.5s 3.2s forwards;
  letter-spacing: 2px;
}

@keyframes fadeIn {
  to { opacity: 0.7; }
}


